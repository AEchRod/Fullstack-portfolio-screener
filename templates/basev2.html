<!DOCTYPE html> <!-- this is the base template/theme for our website -->
<html lang="en">
<head> <!-- we add code below from Bootstrap-->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>
        // follow the computer's light/dark setting; Bootstrap and the charts read data-bs-theme
        (function () {
            var media = window.matchMedia('(prefers-color-scheme: dark)');
            function apply() {
                document.documentElement.setAttribute('data-bs-theme', media.matches ? 'dark' : 'light');
            }
            apply();
            media.addEventListener('change', apply);
        })();
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
    <title>
        Welcome to the first go at a portfolio tracker!
    </title>
</head>
    <body>
            <header class="container text-center pt-4">
                <h1><a class="text-reset text-decoration-none" href="{{ url_for('start_page') }}">Portfolio tracker</a></h1>
            </header>
            <div class="container">
                <div class="alert alert-info text-center" role="alert">
                    First iteration using HTML and Flask to create web app.
                </div>
            </div>
            <!-- <div class="d-grid col-6 mx-auto text-center">
                <a href="/portfolio/"><button class="btn btn-primary mx-auto" type="button">See your portfolio!</button></a>
                note: we use onclick for button instead of href
            </div> -->
            {% block content %}{% endblock %} <!-- This indicated to Jinja where page will be extended-->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        {% block scripts %}{% endblock %}
    </body>
</html>
